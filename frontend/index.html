<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeIA — Leitor Inteligente com IA</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg leia-navbar">
    <div class="container-fluid">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <span class="leia-logo">LeIA</span>
        <small class="text-secondary" id="doc-title"></small>
      </span>
      <div class="d-flex align-items-center gap-3">
        <span id="hw-badge" class="badge bg-secondary">detectando…</span>
        <button id="btn-close-doc" class="btn btn-sm btn-outline-light d-none">✕ fechar</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <section id="view-upload" class="d-flex justify-content-center">
      <div id="dropzone" class="dropzone">
        <div class="dropzone-inner">
          <div class="dropzone-icon">📄</div>
          <div class="h4 mb-2">Arraste seu PDF aqui</div>
          <div class="text-secondary mb-3">ou clique para selecionar</div>
          <input type="file" id="file-input" accept="application/pdf" hidden />
          <button class="btn btn-primary" id="btn-pick">Selecionar arquivo</button>
        </div>
        <div id="upload-progress" class="mt-4 d-none">
          <div class="progress" style="height: 8px;">
            <div id="upload-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <div id="upload-status" class="text-secondary small mt-2">Enviando…</div>
        </div>
      </div>
    </section>

    <section id="view-reader" class="d-none">
      <div class="row g-3">
        <aside class="col-md-3">
          <div class="card leia-card">
            <div class="card-header">Sumário</div>
            <div class="card-body p-2">
              <ul id="toc" class="list-unstyled mb-0 small"></ul>
            </div>
          </div>
          <div class="card leia-card mt-3">
            <div class="card-header">Limpeza</div>
            <div class="card-body small" id="cleaning-stats"></div>
          </div>
        </aside>
        <section class="col-md-9">
          <div id="reader" class="reader card leia-card">
            <div class="card-body" id="reader-body"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer id="player-bar" class="player-bar d-none">
    <div class="container-fluid d-flex align-items-center gap-3">
      <button id="btn-prev" class="btn btn-outline-light btn-sm">⏮</button>
      <button id="btn-play" class="btn btn-primary btn-sm">▶</button>
      <button id="btn-next" class="btn btn-outline-light btn-sm">⏭</button>
      <div class="flex-grow-1 small text-secondary" id="now-reading">—</div>
      <label class="small text-secondary mb-0">Velocidade</label>
      <select id="speed-select" class="form-select form-select-sm w-auto">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>
    </div>
  </footer>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="/static/js/api-client.js"></script>
  <script src="/static/js/pdf-upload.js"></script>
  <script src="/static/js/reader.js"></script>
  <script src="/static/js/player.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
